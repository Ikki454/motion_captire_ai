[project]
name = "ai-motion-capture"
version = "0.1.0"
description = "AI-assisted video to Blender animation application"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
"numpy>=2.0",
"scipy>=1.13",
"opencv-contrib-python>=4.10",
"PySide6>=6.8",
]

[project.optional-dependencies]
mediapipe = [
"mediapipe>=1.0",
]

[project.scripts]
ai-motion-capture = "app.main:main"

[project.gui-scripts]
ai-motion-capture-gui = "app.main:main"

[dependency-groups]
dev = [
"pytest>=8.0",
"ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
# the pose model is a runtime download, not a shipped asset
exclude = ["/models", "/dist", "/.venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
